
services:
  postgres:
    image: postgres:17-alpine
    container_name: incident-hub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: incidenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: incidenthub

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidenthub -d incidenthub
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
